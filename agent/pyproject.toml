[project]
name = "regwatch-agent"
version = "0.1.0"
description = "RegWatch — couche RAG : ingestion, chunking et retrieval du corpus DORA × EU AI Act"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Antoine Delamare", email = "antoine@blockchain-cie.com" }]

dependencies = [
    "fastembed==0.8.0",
    "httpx==0.28.1",
    # Required by langfuse.langchain: the CallbackHandler refuses to import
    # without the umbrella package, which langchain-core alone does not satisfy.
    # Measured cost: a single package, its whole tree being already present.
    "langchain==1.4.1",
    "langchain-mistralai==1.1.6",
    "langfuse==4.15.4",
    "langgraph==1.2.11",
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "qdrant-client==1.19.0",
    "selectolax==0.4.11",
]

[project.optional-dependencies]
# Back-end d'embeddings cloud, non installé par défaut (voir DC2 des notes).
mistral = ["mistralai==2.10.0"]
# Evaluation pipeline, not installed by default: ragas pulls 44 packages
# (datasets, pandas, pyarrow, scipy, openai) the runtime has no use for.
eval = [
    "ragas==0.4.3",
    # Deliberate bound, do not raise without checking the import first.
    # langchain-community 0.4.x dropped chat_models.vertexai, which
    # ragas/llms/base.py imports unconditionally: installation succeeds and the
    # package is unusable on first import. 0.3.31 resolves and imports cleanly.
    "langchain-community<0.4",
]

[dependency-groups]
dev = ["anyio==4.12.0", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "mcp_server", "graph", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: nécessite un Qdrant joignable (désactivé par défaut)",
    "network: nécessite un accès réseau à EUR-Lex",
]
addopts = "-m 'not integration and not network'"
