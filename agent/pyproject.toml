[project]
name = "regwatch-agent"
version = "0.1.0"
description = "RegWatch — couche RAG : ingestion, chunking et retrieval du corpus DORA × EU AI Act"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Antoine Delamare", email = "antoine@blockchain-cie.com" }]

dependencies = [
    "fastembed==0.8.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "qdrant-client==1.19.0",
    "selectolax==0.4.11",
]

[project.optional-dependencies]
# Back-end d'embeddings cloud, non installé par défaut (voir DC2 des notes).
mistral = ["mistralai==2.10.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: nécessite un Qdrant joignable (désactivé par défaut)",
    "network: nécessite un accès réseau à EUR-Lex",
]
addopts = "-m 'not integration and not network'"
