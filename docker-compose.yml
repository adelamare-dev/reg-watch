# RegWatch — infrastructure services.
#
# Qdrant and the MCP tool server are declared so far; the `web`, `runtime` and
# `agent` services land together with their own layers.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: regwatch-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + dashboard web
      - "6334:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The Qdrant image ships neither curl nor wget, so probe the binary itself.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: regwatch-mcp
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      # Reaches Qdrant over the compose network, not the host.
      QDRANT_URL: http://qdrant:6333
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8300"
      # The in-image layout has no repository root above the package, so the
      # path the settings derive by default does not apply here.
      MANIFEST_PATH: /corpus/corpus-manifest.json
    volumes:
      # Re-read after every ingestion, so it is mounted rather than baked in.
      - ./corpus-manifest.json:/corpus/corpus-manifest.json:ro
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant-storage:
