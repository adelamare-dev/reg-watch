# RegWatch — infrastructure services.
#
# Only Qdrant is declared so far; the `web`, `runtime`, `mcp` and `agent`
# services land together with their own layers.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: regwatch-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + dashboard web
      - "6334:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The Qdrant image ships neither curl nor wget, so probe the binary itself.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant-storage:
